name: Android build

on:
  push:
    branches: [main, notifyme-v1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build release (unsigned)
        id: build
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease bundleRelease > build.log 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          tail -n 60 build.log

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p out
          echo "commit=${GITHUB_SHA}" > out/status.txt
          echo "exit=${{ steps.build.outputs.code }}" >> out/status.txt
          grep -E "^e: |error:|FAILED|What went wrong" -A 3 build.log | head -n 400 > out/errors.txt || true
          tail -n 400 build.log > out/build-tail.txt
          BT="$ANDROID_HOME/build-tools/36.0.0"
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          if [ -f "$APK" ]; then
            "$BT/zipalign" -p -f 4 "$APK" out/app-release-unsigned-aligned.apk
            cp "$BT/lib/apksigner.jar" out/
          fi
          cp app/build/outputs/bundle/release/app-release.aab out/ 2>/dev/null || true
          mkdir -p out/tests && cp -r app/build/test-results/testDebugUnitTest/*.xml out/tests/ 2>/dev/null || true
          ls -la out

      - name: Publish outputs to ci-output branch
        if: always()
        run: |
          cd out
          git init -q -b ci-output
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "CI output for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-output
