name: Emulator smoke test
on:
  push:
    branches: [ci-smoke]
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        id: emu
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: mkdir -p shots && bash smoke/smoke.sh > shots/run.log 2>&1
      - name: Publish results
        if: always()
        run: |
          mkdir -p shots && cd shots
          git init -q -b smoke-output
          git config user.name ci && git config user.email ci@users.noreply.github.com
          echo "commit=${GITHUB_SHA}" > status.txt
          echo "emulator=${{ steps.emu.outcome }}" >> status.txt
          df -h / >> status.txt; ls /dev/kvm >> status.txt 2>&1
          git add -A && git commit -qm "smoke ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" smoke-output
