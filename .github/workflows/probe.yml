name: probe
on:
  push:
    branches: [ci-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          echo "ANDROID_HOME=$ANDROID_HOME" > info.txt
          ls $ANDROID_HOME/platforms $ANDROID_HOME/build-tools >> info.txt 2>&1
          java -version >> info.txt 2>&1
          git init -q -b probe-result && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add . && git commit -qm probe
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe-result
